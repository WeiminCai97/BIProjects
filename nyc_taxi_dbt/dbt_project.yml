# =============================================================
#  dbt_project.yml
#  The main config file for this dbt project.
#  dbt reads this every time you run a command.
# =============================================================

name: 'nyc_taxi_dbt'        # Must match your profiles.yml
version: '1.0.0'
config-version: 2

# Which profile (database connection) to use — defined in profiles.yml
profile: 'nyc_taxi_dbt'

# Where dbt looks for different types of files
model-paths:    ["models"]
test-paths:     ["tests"]
macro-paths:    ["macros"]
seed-paths:     ["seeds"]

# Where dbt writes compiled SQL and run results
target-path:    "target"
clean-targets:
  - "target"
  - "dbt_packages"   # where dbt_utils gets installed

# ── Model Materializations ────────────────────────────────────
# "view"  = dbt creates a SQL view  (fast, no storage used)
# "table" = dbt creates a real table (slower, but queryable by BI tools)

models:
  nyc_taxi_dbt:
    staging:
      +materialized: view        # Staging is just a clean view of raw data
      +schema: staging

    intermediate:
      +materialized: view        # Intermediate logic stays as views
      +schema: intermediate

    marts:
      +materialized: table       # Marts are real tables — BI tools read these
      +schema: marts